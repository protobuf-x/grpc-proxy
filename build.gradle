buildscript {
    ext {
        springDependencyManegementVersion = '1.1.7'
        springBootVersion = '4.1.2'
        springCloudVersion = '2025.1.4'
        protobufPluginVersion = '0.9.5'
        protocVersion = '4.36.2'
        grpcVersion = '1.84.1'
        protobufGoogleCommonsVersion = '2.64.1'
        javaxAnnotationVersion = '1.3.2'
    }
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "io.spring.dependency-management:io.spring.dependency-management.gradle.plugin:${springDependencyManegementVersion}"
        classpath "com.google.protobuf:protobuf-gradle-plugin:${protobufPluginVersion}"
    }
}

apply plugin: 'java'
apply plugin: 'idea'

group = 'com.github.protobuf-x'
version = '0.0.1-SNAPSHOT'
java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    repositories {
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }
}

def protoBuildOption = System.properties.containsKey("os.name")
        && System.properties.get("os.name") == "Mac OS X"
        && System.properties.containsKey("os.arch")
        && System.properties.get("os.arch") == "aarch64" ? ':osx-x86_64' : ''

project(':reflection-extension') {
    apply plugin: 'com.google.protobuf'
    apply plugin: 'maven-publish'

    dependencies {
        implementation "javax.annotation:javax.annotation-api:${javaxAnnotationVersion}"
        implementation "com.google.protobuf:protobuf-java:${protocVersion}"
        implementation "io.grpc:grpc-protobuf:${grpcVersion}"
        implementation "io.grpc:grpc-stub:${grpcVersion}"
        implementation "com.google.api.grpc:proto-google-common-protos:${protobufGoogleCommonsVersion}"
    }

    protobuf {
        protoc {
            artifact = "com.google.protobuf:protoc:${protocVersion}${protoBuildOption}"
        }
        plugins {
            grpc {
                artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}${protoBuildOption}"
            }
        }
        generateProtoTasks {
            all()*.plugins {
                grpc {}
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs 'build/generated/source/proto/main/grpc'
                srcDirs 'build/generated/source/proto/main/java'
            }
        }
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId = project.group
                artifactId = project.name
                version = rootProject.version
                from components.java
            }
        }
    }
}

project(':spring-cloud-gateway') {
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'maven-publish'

    dependencies {
        implementation project(':reflection-extension')
        implementation "org.springframework.cloud:spring-cloud-gateway-server-webflux"
        implementation "org.springframework:spring-webflux"
        implementation "io.netty:netty-buffer"
        implementation "tools.jackson.core:jackson-core"
        implementation "tools.jackson.core:jackson-databind"
        implementation "io.grpc:grpc-protobuf:${grpcVersion}"
        implementation "io.grpc:grpc-stub:${grpcVersion}"
        implementation "com.google.protobuf:protobuf-java-util:${protocVersion}"
        compileOnly "org.projectlombok:lombok"
        annotationProcessor "org.projectlombok:lombok"
        implementation "org.jspecify:jspecify"

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation "io.projectreactor:reactor-test"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    jar {
        enabled = true
    }

    test {
        useJUnitPlatform()
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId = project.group
                artifactId = project.name
                version = rootProject.version
                from components.java
            }
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

}

project(':examples:example-spring-cloud-gateway') {
    apply plugin: 'io.spring.dependency-management'

    dependencies {
        implementation project(':spring-cloud-gateway')
        implementation "io.grpc:grpc-protobuf:${grpcVersion}"
        implementation "io.grpc:grpc-netty:${grpcVersion}"
        implementation "io.grpc:grpc-api:${grpcVersion}"
        implementation "io.grpc:grpc-stub:${grpcVersion}"
        implementation "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux"
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }
}

project(':examples:example-server') {
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.google.protobuf'

    dependencies {
        implementation project(':reflection-extension')
        implementation "com.google.protobuf:protobuf-java:${protocVersion}"
        implementation "io.grpc:grpc-stub:${grpcVersion}"
        implementation "io.grpc:grpc-services:${grpcVersion}"
        implementation "org.springframework.boot:spring-boot-starter-grpc-server"
    }

    protobuf {
        protoc {
            artifact = "com.google.protobuf:protoc:${protocVersion}${protoBuildOption}"
        }
        plugins {
            grpc {
                artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}${protoBuildOption}"
            }
        }
        generateProtoTasks {
            all()*.plugins {
                grpc {}
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs 'build/generated/source/proto/main/grpc'
                srcDirs 'build/generated/source/proto/main/java'
            }
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }
}

